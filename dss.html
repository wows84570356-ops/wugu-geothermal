<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大屯地熱決策平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：參照原平台的四階段平行四邊形，其餘簡化成「選角色 → 選階段 → 五個分頁」。 */
:root{
  --bg:#F3F4F2; --surface:#FFFFFF; --sunk:#E8EBE8; --ink:#1D2724; --muted:#5A6762; --line:#D3D9D5;
  --bar:#1C3A44; --bar-ink:#F3F6F5; --accent:#2B7A8C; --accent-bg:#DDEEF1;
  --ok:#1E7B3A; --ok-bg:#DFF1E3; --warn:#8A5A00; --warn-bg:#FBEFD2; --bad:#B23A30; --bad-bg:#F8E0DD; --na:#5A6762; --na-bg:#ECEEEC;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1A2220; --sunk:#151C1A; --ink:#E4EAE7; --muted:#9DABA5; --line:#2E3A36;
  --bar:#0F2229; --bar-ink:#E4EAE7; --accent:#6CC0D1; --accent-bg:#17343B;
  --ok:#6FCF8A; --ok-bg:#16301E; --warn:#E8B95A; --warn-bg:#352A12; --bad:#F08A80; --bad-bg:#3A1C19; --na:#9DABA5; --na-bg:#202826;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1A2220; --sunk:#151C1A; --ink:#E4EAE7; --muted:#9DABA5; --line:#2E3A36;
  --bar:#0F2229; --bar-ink:#E4EAE7; --accent:#6CC0D1; --accent-bg:#17343B;
  --ok:#6FCF8A; --ok-bg:#16301E; --warn:#E8B95A; --warn-bg:#352A12; --bad:#F08A80; --bad-bg:#3A1C19; --na:#9DABA5; --na-bg:#202826;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.7}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--bar);color:var(--bar-ink)}
.top .in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.top b{font-size:18px;letter-spacing:.04em}
.top .who{display:flex;gap:8px;align-items:center;font-size:14px}
.top button{background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--bar-ink);border-radius:6px;padding:3px 12px;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:clamp(22px,3.4vw,30px);margin:0;line-height:1.3}
h2{font-size:20px;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.case{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:6px}
.tag{display:inline-block;font-size:12px;border-radius:4px;padding:1px 8px;background:var(--accent);color:#fff;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}

/* 選角色 */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.role{display:grid;grid-template-columns:44px 1fr;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.role:hover{border-color:var(--accent)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;background:var(--rc)}
.role b{display:block}
.role span{font-size:13px;color:var(--muted);line-height:1.5}
.role .av{color:#fff;font-size:18px;line-height:1}

/* 四階段 */
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:18px 0 6px}
.stg{position:relative;border:0;background:transparent;padding:0;cursor:pointer;min-height:76px}
.stg .shape{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);transform:skewX(-14deg);border-radius:4px}
.stg[aria-current="step"] .shape{background:var(--accent-bg);border-color:var(--accent);border-width:2px}
.stg .lab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:8px 14px;text-align:center}
.stg .lab b{font-size:15px;line-height:1.3}
.stg .lab small{font-size:12px;color:var(--muted)}
@media (max-width:640px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}.stg .shape{transform:none}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:0 8px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-na{background:var(--na-bg);color:var(--na)}

/* 我的任務 */
.task{border-left:5px solid var(--rc);margin:14px 0}
.task p{margin:2px 0 0}

/* 分頁 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rc);margin-left:5px;vertical-align:middle}

/* 文件 */
.docs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.doc{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.doc input{width:18px;height:18px;margin-top:4px;accent-color:var(--accent)}
.doc p{margin:0}
.doc .why{font-size:13px;color:var(--muted)}
.progress{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--accent)}

/* 因子 */
.factors{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fac{display:flex;flex-direction:column;gap:6px}
.fac.focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fac .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fac table{border-collapse:collapse;width:100%;font-size:13.5px}
.fac td{padding:4px 0;border-top:1px solid var(--line);vertical-align:top}
.fac td:first-child{color:var(--muted);padding-right:10px;width:42%}
.fac td b{font-weight:700}
.src{font-size:11.5px;color:var(--muted)}
.src a{color:inherit}
.lim{font-size:13px;background:var(--sunk);border-radius:6px;padding:6px 10px;margin:0}
.wt{display:flex;align-items:center;gap:8px;font-size:13px}
.wt input{width:64px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

/* 門檻 */
.rules{display:flex;flex-direction:column;gap:10px}
.rule{display:grid;grid-template-columns:52px minmax(0,1fr) 150px;gap:10px;align-items:start}
@media (max-width:640px){.rule{grid-template-columns:44px minmax(0,1fr)}.rule select{grid-column:2}}
.rule .id{font-weight:700;font-size:18px;color:var(--accent)}
.rule p{margin:0}
.rule select,.f select,.f textarea,.f input[type=number]{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:5px 8px}
.nature{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap}

/* 意見、評分、審查 */
.f{display:flex;flex-direction:column;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f textarea{min-height:76px;resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ops{display:flex;flex-direction:column;gap:8px}
.op{border-left:4px solid var(--rc);padding:6px 0 6px 12px;background:var(--surface);border-radius:0 8px 8px 0}
.op p{margin:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.scoretbl{width:100%;border-collapse:collapse;font-size:14px}
.scoretbl th,.scoretbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.scoretbl th{font-size:12.5px;color:var(--muted);font-weight:500}
.scoretbl input{width:70px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.big{font-size:34px;font-weight:700;line-height:1.1}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:36px;padding-top:12px}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--muted);font-size:10.5px;font-family:var(--f)}
.chart .vl{fill:var(--ink);font-size:11.5px;font-weight:700;font-family:var(--f)}
.chart .hit{cursor:default}
.charttip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:3px 8px;border-radius:4px;z-index:9;white-space:nowrap}
.readonly{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:6px 10px;margin:0 0 10px}

/* 新聞始末 */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.era{margin:26px 0 4px}
.era h3{font-size:19px;margin:0;padding:4px 0 4px 10px;border-left:5px solid var(--accent);line-height:1.4}
.era h3 .yr{display:inline-block;font-size:12.5px;font-weight:600;background:var(--accent);color:#fff;border-radius:4px;padding:0 7px;margin-right:8px;vertical-align:2px}
.nh2{font-size:24px;margin:0 0 2px;line-height:1.35}
.nh2 em{font-style:normal;color:var(--accent)}
.keys{list-style:none;margin:10px 0 6px;padding:10px 12px;background:var(--accent-bg);border-radius:8px;display:grid;gap:4px}
.keys li{font-size:14px}
.keys b{color:var(--accent);margin-right:6px;font-variant-numeric:tabular-nums}
.ti .hl{font-size:15.5px;font-weight:700;line-height:1.5;color:var(--ink)}
.ti a.hl{text-decoration:none;border-bottom:1px solid var(--line)}
.ti .dt{font-weight:600}
.era p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.tl{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.ti{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ti::before{content:"";position:absolute;left:-20px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.ti.ev::before{background:var(--accent)}
.ti .dt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ti p{margin:0}
.ti .meta{font-size:12.5px;color:var(--muted)}
.kind{font-size:11.5px;border-radius:4px;padding:0 6px;margin-right:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ti.ev .kind{background:var(--accent-bg);border-color:var(--accent);color:var(--ink)}
@media (max-width:640px){.ti{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

/* 單一數列長條圖（容量與發電量分兩張，不共用 y 軸） */
function barChart(key,title,unit){
  const W=360,H=180,pl=34,pr=8,pt=22,pb=24,vals=ANNUAL.map(r=>r[key]).filter(v=>v!=null);
  const step=key==="cap"?2:10,top=Math.ceil(Math.max(...vals)*1.15/step)*step;
  const n=ANNUAL.length,bw=(W-pl-pr)/n,barW=Math.min(30,bw-8),y=v=>pt+(H-pt-pb)*(1-v/top);
  const ticks=[];for(let t=0;t<=top;t+=step)ticks.push(t);
  let lastIdx=-1;ANNUAL.forEach((r,i)=>{if(r[key]!=null)lastIdx=i});
  const bars=ANNUAL.map((r,i)=>{const cx=pl+bw*i+bw/2,x0=cx-barW/2,v=r[key];
    const lab=`<text x="${cx}" y="${H-pb+15}" text-anchor="middle" class="ax">${r.y}</text>`;
    if(v==null)return `${lab}<rect x="${x0}" y="${y(top*0.25)}" width="${barW}" height="${y(0)-y(top*0.25)}" fill="none" stroke="var(--muted)" stroke-dasharray="3 3" rx="4"/><text x="${cx}" y="${y(top*0.25)-5}" text-anchor="middle" class="ax">缺</text>
      <rect class="hit" x="${pl+bw*i}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent" data-tip="${r.y}：缺資料"/>`;
    const yy=y(v),h=y(0)-yy,rr=Math.min(4,h);
    const d=h<=0?"":`M${x0},${y(0)} V${yy+rr} Q${x0},${yy} ${x0+rr},${yy} H${x0+barW-rr} Q${x0+barW},${yy} ${x0+barW},${yy+rr} V${y(0)} Z`;
    const note=key==="gen"&&r.genNote?`（${r.genNote}）`:"";
    return `${lab}${d?`<path d="${d}" fill="var(--accent)" ${note?'fill-opacity=".55"':""}/>`:""}
      ${i===lastIdx?`<text x="${cx}" y="${yy-6}" text-anchor="middle" class="vl">${v}</text>`:""}
      <rect class="hit" x="${pl+bw*i}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent" data-tip="${r.y}：${v} ${unit.split("（")[0]}${note}"/>`}).join("");
  const desc=`${title}（${unit}）：`+ANNUAL.map(r=>`${r.y} ${r[key]??"缺"}`).join("、");
  return `<figure class="chart" style="margin:0"><figcaption class="small"><b>${title}</b> <span class="muted">${unit}</span></figcaption>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(desc)}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+3.5}" text-anchor="end" class="ax">${t}</text>`).join("")}
    ${bars}</svg></figure>`;
}

    return `<div class="card rule"><span class="id">${id}</span><div><p><b>${esc(x[0])}</b></p><p class="small">結果：${esc(x[1])}　<span class="nature">${esc(x[2])}</span>　<span class="src">來源 ${links(x[3])}</span></p></div>
    ${can("rules")?`<select data-rule="${S.stage}-${id}" aria-label="${id} 判定"><option value="" ${!v?"selected":""}>待確認</option><option ${v==="未觸發"?"selected":""}>未觸發</option><option ${v==="觸發"?"selected":""}>觸發</option></select>`
      :`<span class="chip ${v==="未觸發"?"c-ok":v==="觸發"?"c-bad":"c-na"}" style="justify-self:start">${v||"待確認"}</span>`}</div>`}).join("")}</div>`;
}
function pOps(){
  const list=S.ops.filter(o=>o.stage===S.stage);
  $("#panel").innerHTML=`<div class="grid2"><div>
  <h2>表達意見</h2>
  ${can("opinion")?`<form class="f" id="opf"><label for="op-stance">立場<select id="op-stance"><option>支持</option><option selected>附條件支持</option><option>反對</option><option>需要更多資料</option></select></label>
    <label for="op-text">理由與條件（引用因子或門檻，例如「地下水質：溫泉水位基線未公開」）<textarea id="op-text" required></textarea></label>
    <button class="btn" type="submit">送出意見</button></form>`:`<p class="readonly">你的角色不在這裡表達意見。</p>`}
  </div><div><h2>本階段的意見（${list.length}）</h2>
  <div class="ops">${list.length?list.map(o=>`<div class="op" style="--rc:${ROLES[o.role].c}"><p><b>${ROLES[o.role].name}</b>・${esc(o.stance)}　<span class="small muted">${esc(o.time)}</span></p><p>${esc(o.text)}</p></div>`).join(""):`<p class="muted">還沒有意見。</p>`}</div></div></div>`;
}
function weighted(){const ids=FACTORS.map(f=>f.id).filter(id=>S.scores[id]!=null&&S.scores[id]!=="");
  if(!ids.length||wsum()===0)return null;const w=ids.reduce((a,id)=>a+(+S.weights[id]||0),0);if(!w)return null;
  return Math.round(ids.reduce((a,id)=>a+(+S.scores[id])*(+S.weights[id]||0),0)/w)}
function pReview(){
  const st=STAGES[S.stage],n=st.docs.length,done=st.docs.filter((_,i)=>S.docs[S.stage+"-"+i]).length;
  const trig=st.rules.filter(id=>S.rules[S.stage+"-"+id]==="觸發"),pend=st.rules.filter(id=>!S.rules[S.stage+"-"+id]);
  const ops=S.ops.filter(o=>o.stage===S.stage),cnt=s=>ops.filter(o=>o.stance===s).length;
  const ws=weighted(),prevOK=S.stage===0||(S.permit[S.stage-1]&&S.permit[S.stage-1].d!=="退件");
  const p=S.permit[S.stage]||{};
  $("#panel").innerHTML=`<h2>${st.name}：審查與許可</h2>
  <div class="grid2" style="margin-bottom:16px">
    <div class="card"><h3>審查摘要</h3>
      <p style="margin:0">文件：<b>${done}／${n}</b> 已備妥</p>
      <p style="margin:0">門檻：${trig.length?`<span class="chip c-bad">觸發 ${trig.join("、")}</span>`:`<span class="chip c-ok">無觸發</span>`} ${pend.length?`<span class="chip c-na">待確認 ${pend.join("、")}</span>`:""}</p>
      <p style="margin:0">意見：支持 ${cnt("支持")}・附條件 ${cnt("附條件支持")}・反對 ${cnt("反對")}・要更多資料 ${cnt("需要更多資料")}</p>
      <p style="margin:6px 0 0">專家加權分數：</p><p class="big" style="margin:0">${ws==null?"—":ws}</p>
      <p class="small muted" style="margin:0">${ws==null?"專家還沒評分，或權重總和為 0。":`以主管機關權重加權（權重總和 ${wsum()}）。分數是參考，不取代門檻。`}</p></div>
    <div class="card"><h3>專家評分（0–100，越高越有利）</h3>
      ${can("score")?"":`<p class="readonly">由專家填寫。</p>`}
      <table class="scoretbl"><thead><tr><th>因子</th><th>權重</th><th>分數</th></tr></thead><tbody>
      ${FACTORS.map(f=>`<tr><td>${esc(f.name)}</td><td>${S.weights[f.id]||0}%</td><td>${can("score")?`<input type="number" min="0" max="100" step="5" data-score="${f.id}" value="${S.scores[f.id]??""}" aria-label="${esc(f.name)} 分數">`:(S.scores[f.id]??"—")}</td></tr>`).join("")}
      </tbody></table></div>
  </div>
  <div class="grid2">
    <div class="card f"><h3>審查紀錄</h3>
      <label for="rv">審查者的紀錄與建議（缺哪些文件、哪些疑慮未解決）<textarea id="rv" ${can("review")?"":"readonly"}>${esc(S.review[S.stage]||"")}</textarea></label>
      ${can("review")?`<button class="btn" type="button" data-act="saveReview">儲存審查紀錄</button>`:""}</div>
    <div class="card f"><h3>許可決定</h3>
      ${!prevOK?`<p class="readonly">上一階段尚未核可，這一階段還不能核發許可。</p>`:""}
      <label for="pd">決定<select id="pd" ${can("permit")&&prevOK?"":"disabled"}><option value="">尚未決定</option>${["核可","附條件核可","退件"].map(d=>`<option ${p.d===d?"selected":""}>${d}</option>`).join("")}</select></label>
      <label for="pr">依據與條件（條件要寫數值、期限與負責人）<textarea id="pr" ${can("permit")&&prevOK?"":"readonly"}>${esc(p.r||"")}</textarea></label>
      ${can("permit")?`<button class="btn" type="button" data-act="permit" ${prevOK?"":"disabled"}>送出決定</button>`:""}
      ${trig.length&&can("permit")?`<p class="small" style="color:var(--bad);margin:0">提醒：本階段有門檻被判定為觸發（${trig.join("、")}）。</p>`:""}</div>
  </div>
  <p style="margin-top:16px"><button class="btn ghost" type="button" data-act="copy">複製本階段摘要</button> <span class="small muted" id="msg" role="status"></span></p>`;
}
function pNews(){
  const f=S.nf||"all",c=S.nc||"",st=STAGES[S.stage];
  let items=[...EVENTS.map(x=>({...x,kd:"e"})),...NEWS.map(x=>({...x,kd:"n"}))];
  if(f==="news")items=items.filter(x=>x.kd==="n");
  if(f==="event")items=items.filter(x=>x.kd==="e");
  if(f==="stage")items=items.filter(x=>x.kd==="n"&&x.stg.includes(S.stage));
  if(c)items=items.filter(x=>x.cat===c);
  items.sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:(a.kd===b.kd?0:a.kd==="e"?1:-1));
  const cats=["政策法規","開發案場","探勘調查","事故與爭議","火山與地震","市場與購電","背景"];
  const seg=(attr,cur,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-${attr}="${v}" aria-pressed="${cur===v}">${l}</button>`).join("")}</div>`;
  const row=x=>x.kd==="n"
    ?`<li class="ti"><span class="dt">${esc(x.date)}</span><div><p><span class="kind">新聞</span><span class="small muted">${esc(x.media)}・${esc(x.cat)}</span></p>
       <p><a class="hl" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>${x.own?' <span class="small muted">（標題為自擬簡稱）</span>':""}</p>
       <p>${esc(x.sum)}</p><p class="meta">案場：${esc(x.sites)}｜階段：${esc(x.sraw)}｜角色：${esc(x.roles)}</p></div></li>`
    :`<li class="ti ev"><span class="dt">${esc(x.date)}</span><div><p><span class="kind">大事紀 ${esc(x.id)}</span><span class="small muted">${esc(x.cat)}</span></p>
       <p class="hl">${esc(x.text)}</p><p class="meta">${x.mean&&x.mean!=="—"?`意義：${esc(x.mean)}｜`:""}來源 ${links(x.src)}</p></div></li>`;
  const eraT=t=>{const m=t.replace(/^[一二三四五六七八九十]+、/,"").match(/^(.*?)（(.*)）$/);return m?[m[1],m[2]]:[t,""]};
  const body=[...ERAS].reverse().map(([a,b,t,d])=>{const g=items.filter(x=>x.k>=a&&x.k<=b);if(!g.length)return "";const [tt,yr]=eraT(t);
    return `<section class="era"><h3><span class="yr">${yr}</span>${tt} <span class="small muted" style="font-weight:400">${g.length} 筆</span></h3>${f==="all"&&!c?`<p>${d}</p>`:""}<ol class="tl">${g.map(row).join("")}</ol></section>`}).join("");
  $("#panel").innerHTML=`<h2 class="nh2">新聞始末：<em>大屯地熱的來龍去脈</em></h2>
  <ul class="keys">${[...ERAS].reverse().map(([,,t])=>{const [tt,yr]=eraT(t);return `<li><b>${yr}</b>${tt}</li>`}).join("")}</ul>
  <p class="muted small" style="margin-top:0">由新到舊排列：最上面是最近的發展，往下捲是更早的歷史。把歷史大事紀（${EVENTS.length} 筆）與 2023-11 到 2026-11 的新聞（${NEWS.length} 則）排成一條時間軸。實心點是大事紀，空心點是新聞。新聞摘要為改寫；標題標「自擬簡稱」的，請以連結頁面的原標題為準。</p>
  ${seg("nf",f,[["all","全部始末"],["news","只看新聞"],["event","只看大事紀"],["stage",`與「${st.name}」有關的新聞`]])}
  ${seg("nc",c,[["","所有類型"],...cats.map(x=>[x,x])])}
  <p class="small muted" style="margin:0">共 ${items.length} 筆</p>
  ${body||`<p class="muted">沒有符合條件的項目。</p>`}
  <p class="small" style="margin-top:14px">討論：從這條時間軸看，哪幾個轉折點如果當時有更完整的資訊公開或地方溝通，後來的爭議可能會比較小？</p>`;
}
function summary(){
  const st=STAGES[S.stage],i=S.stage,p=S.permit[i]||{};
  const L=[`【大屯地熱開發教學案】${st.name}（${st.s}）`,
   `文件：${st.docs.filter((_,k)=>S.docs[i+"-"+k]).length}/${st.docs.length} 已備妥`,
   `門檻：${st.rules.map(id=>`${id} ${S.rules[i+"-"+id]||"待確認"}`).join("；")}`,
   `專家加權分數：${weighted()??"—"}`,
   `意見：`+(S.ops.filter(o=>o.stage===i).map(o=>`${ROLES[o.role].name}（${o.stance}）${o.text}`).join(" / ")||"無"),
   `審查紀錄：${S.review[i]||"無"}`,
   `許可決定：${p.d||"尚未決定"}${p.r?"；依據："+p.r:""}`];
  return L.join("\n");
}

/* ============ 事件 ============ */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.role){S.role=b.dataset.role;S.tab="docs";save();render();window.scrollTo(0,0);return}
  if(b.dataset.stage){S.stage=+b.dataset.stage;save();render();return}
  if(b.dataset.tab){S.tab=b.dataset.tab;save();render();return}
  if(b.dataset.nf!==undefined){S.nf=b.dataset.nf;save();render();return}
  if(b.dataset.nc!==undefined){S.nc=b.dataset.nc;save();render();return}
  const a=b.dataset.act;
  if(a==="switch"){S.role=null;save();render();return}
  if(a==="reset"){if(confirm("確定要清除這台裝置上所有的填寫內容嗎？")){const r=S.role;S=blank();S.role=r;save();render()}return}
  if(a==="saveReview"){S.review[S.stage]=$("#rv").value;save();render();return}
  if(a==="permit"){const d=$("#pd").value,r=$("#pr").value.trim();if(!d){alert("請先選擇決定。");return}if(d!=="核可"&&!r){alert("附條件核可或退件，請寫明依據與條件。");return}
    S.permit[S.stage]={d,r};save();render();return}
  if(a==="copy"){const t=summary(),m=$("#msg");
    const ok=()=>{m.textContent="已複製。"},bad=()=>{m.textContent="無法自動複製，請改用手動選取。";prompt("請複製以下內容：",t)};
    try{navigator.clipboard.writeText(t).then(ok,bad)}catch(x){bad()}}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="opf"){e.preventDefault();const t=$("#op-text").value.trim();if(!t)return;
    const d=new Date();S.ops.push({role:S.role,stage:S.stage,stance:$("#op-stance").value,text:t,time:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`});save();render()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.doc){S.docs[t.dataset.doc]=t.checked;save();render();return}
  if(t.dataset.rule){S.rules[t.dataset.rule]=t.value;save();return}
  if(t.dataset.w){S.weights[t.dataset.w]=Math.max(0,Math.min(100,+t.value||0));save();render();return}
  if(t.dataset.score){S.scores[t.dataset.score]=t.value===""?"":Math.max(0,Math.min(100,+t.value));save();return}
});
/* 長條圖提示框 */
const tip=document.createElement("div");tip.className="charttip";tip.hidden=true;document.body.appendChild(tip);
document.addEventListener("pointermove",e=>{const h=e.target.closest&&e.target.closest(".hit");
  if(!h){tip.hidden=true;return}tip.textContent=h.dataset.tip;tip.hidden=false;
  tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=(e.clientY-30)+"px"});
document.addEventListener("pointerdown",e=>{const h=e.target.closest&&e.target.closest(".hit");if(!h)tip.hidden=true});
render();
</script>
</body>
</html>
