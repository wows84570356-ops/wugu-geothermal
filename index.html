<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>霧谷角色數據手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 版面概念：野外調查筆記本。左側是「我的身分」，右側是依分頁切換的資料；頂端是一條岩層色帶。 */
:root{
  --bg:#EDF0EB; --surface:#FAFBF8; --sunk:#E2E7E1; --ink:#1C2420; --muted:#56635B; --line:#C9D1CA;
  --deep:#244A3D; --sulfur:#9A7400; --sulfur-bg:#F6EBC4;
  --r-lubi:#A65A12; --r-xiong:#A23A2E; --r-lili:#17706B; --r-lanlan:#5E4391; --r-zhizhi:#235F9C; --r-gugu:#5F6B1E;
  --strata1:#6B4A2E; --strata2:#A8743E; --strata3:#C9A15B; --strata4:#5A7F6E; --strata5:#2F5D7A;
  --f-display:"LXGW WenKai TC","Noto Serif TC","Kaiti TC","DFKai-SB",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --sunk:#151C18; --ink:#E3EAE5; --muted:#9BA9A1; --line:#2F3B35;
  --deep:#8CC9B2; --sulfur:#E2B84A; --sulfur-bg:#3A3118;
  --r-lubi:#E59A55; --r-xiong:#EA7F72; --r-lili:#5CC5BD; --r-lanlan:#B39AE6; --r-zhizhi:#78B2EC; --r-gugu:#B7C46A;
  --strata1:#7B5A3E; --strata2:#9C6E3E; --strata3:#B08C4E; --strata4:#4E7464; --strata5:#2E5770;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --sunk:#151C18; --ink:#E3EAE5; --muted:#9BA9A1; --line:#2F3B35;
  --deep:#8CC9B2; --sulfur:#E2B84A; --sulfur-bg:#3A3118;
  --r-lubi:#E59A55; --r-xiong:#EA7F72; --r-lili:#5CC5BD; --r-lanlan:#B39AE6; --r-zhizhi:#78B2EC; --r-gugu:#B7C46A;
  --strata1:#7B5A3E; --strata2:#9C6E3E; --strata3:#B08C4E; --strata4:#4E7464; --strata5:#2E5770;
  color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;margin:0}
.strata{height:10px;background:linear-gradient(to bottom,var(--strata1) 0 20%,var(--strata2) 20% 40%,var(--strata3) 40% 60%,var(--strata4) 60% 80%,var(--strata5) 80% 100%)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:8px 18px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.2;margin:0;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.case{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:4px;white-space:nowrap}

.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;margin-top:22px}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}

/* 身分選擇 */
.picker{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:6px}
.picker .lab{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:2px}
.rolebtn{display:grid;grid-template-columns:38px 1fr;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;color:var(--ink);font:inherit;cursor:pointer}
.rolebtn:hover{background:var(--surface);border-color:var(--line)}
.rolebtn[aria-pressed="true"]{background:var(--surface);border-color:var(--rc)}
.rolebtn:focus-visible,.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--sulfur);outline-offset:2px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--surface);background:var(--rc)}
.rolebtn b{display:block;font-weight:700;line-height:1.3}
.rolebtn small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
@media (max-width:820px){
  .picker{position:static;flex-direction:row;flex-wrap:wrap}
  .picker .lab{flex-basis:100%}
  .rolebtn{width:auto;grid-template-columns:30px auto;padding:4px 10px 4px 4px;border-color:var(--line);border-radius:999px}
  .av{width:30px;height:30px;font-size:15px}
  .rolebtn small{display:none}
}

/* 分頁 */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sulfur)}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.3;margin:0 0 6px;text-wrap:balance}
h3{font-size:16px;font-weight:700;margin:0 0 8px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 20px;max-width:68ch}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}

/* 角色頁 */
.rolehead{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:start;margin-bottom:22px}
.rolehead .av{width:64px;height:64px;font-size:32px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:28px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.fact .eyebrow{display:block;margin-bottom:2px}
.fact p{margin:0}
.section{margin-bottom:30px}
.mydata{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.mydata .row{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:6px 20px;padding:12px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.mydata .row{grid-template-columns:minmax(0,1fr)}}
.dname{font-weight:700;color:var(--ink);background:none;border:0;padding:0;font:inherit;font-weight:700;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.dname:hover{text-decoration-color:var(--sulfur)}
.unit{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.row p{margin:0}
ul.plain{margin:0;padding-left:1.2em}
ul.plain li{margin-bottom:4px}
.misread{display:flex;flex-direction:column;gap:10px}
.misread div{border-left:3px solid var(--sulfur);padding:2px 0 2px 12px}
.misread q{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer;line-height:1.6}
.chip.on{background:var(--sulfur-bg);border-color:var(--sulfur)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--rc,var(--muted))}
.letter{font-family:var(--f-mono);font-weight:500}
.secret{background:var(--sulfur-bg);border-radius:8px;padding:12px 14px}

/* 事件卡 */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.evlist{display:flex;flex-direction:column;gap:10px}
details.ev{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.ev[open]{border-color:var(--muted)}
details.ev summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
details.ev summary::-webkit-details-marker{display:none}
.core{width:44px;height:44px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:20px;color:var(--surface);background:linear-gradient(to bottom,var(--strata2),var(--strata1))}
.evt{font-weight:700;line-height:1.4}
.src{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.spk{font-size:12.5px;white-space:nowrap;color:var(--rc);font-weight:700}
.mine{font-size:11.5px;letter-spacing:.06em;background:var(--sulfur-bg);color:var(--ink);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:500;white-space:nowrap}
.evbody{padding:0 14px 16px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:14px}
.quote{border-left:3px solid var(--rc);padding-left:12px;margin:0}
.quote b{color:var(--rc)}
.meaning{background:var(--sunk);border-radius:8px;padding:12px 14px}
.meaning p{margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.opt h4{margin:0 0 6px;font-size:14.5px}
.opt p{margin:0;font-size:14px}
.foryou{border:1px dashed var(--rc);border-radius:8px;padding:12px 14px}
.foryou p{margin:0 0 6px}
.foryou p:last-child{margin:0}

/* 判斷卡 */
.judge{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.judge{grid-template-columns:minmax(0,1fr)}}
form.jf{display:flex;flex-direction:column;gap:12px}
form.jf label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
form.jf select,form.jf textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
form.jf textarea{min-height:64px;resize:vertical}
.out{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;align-self:start}
.out .sentence{font-size:16px;line-height:1.9}
.out .sentence u{text-decoration:none;background:var(--sulfur-bg);padding:0 3px;border-radius:3px}
.btn{font:inherit;font-weight:700;background:var(--deep);color:var(--surface);border:0;border-radius:8px;padding:8px 16px;cursor:pointer;align-self:flex-start}
.hint{font-size:13px;color:var(--muted);margin:0}
.stones{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stone{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.stone b{display:block}
.stone span{font-size:13.5px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:36px;padding-top:12px}

/* 角色台詞 */
.myline{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--rc);border-radius:8px;padding:14px 16px;margin:12px 0 22px;display:flex;flex-direction:column;gap:8px}
.myline .say{font-family:var(--f-display);font-size:19px;line-height:1.6;margin:0}
.myline .ask{margin:0;font-size:14.5px}
.myline .ask b{color:var(--rc)}
.alllines{display:flex;flex-direction:column;gap:8px}
.alllines .ln{border-left:3px solid var(--rc);padding:2px 0 2px 12px;font-size:14.5px}
.alllines .ln b{color:var(--rc)}
.alllines .ln.me{background:var(--sulfur-bg);border-radius:0 6px 6px 0;padding-block:6px}
.alllines .ask{display:block;color:var(--muted);font-size:13px}
.situ{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--rc);border-radius:8px;padding:14px 16px}
.situ h3{margin:2px 0 6px}
.situ p{margin:0;font-size:15.5px;line-height:1.8}
.sixsitu summary{cursor:pointer}
/* 抽卡現場 */
:root{--st-good:#0ca30c;--st-warn:#fab219;--st-bad:#d03b3b;--st-na:var(--muted)}
.drawbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:18px}
.letters{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;flex-basis:100%}
.lt{font-family:var(--f-mono);font-size:18px;font-weight:500;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;position:relative}
.lt.on{background:var(--deep);color:var(--surface);border-color:var(--deep)}
.lt.done::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--sulfur)}
.mebar{display:none}
@media (max-width:820px){
  .picker.collapsed .rolebtn,.picker.collapsed .lab{display:none}
  .picker.collapsed .mebar{display:flex}
  .mebar{flex-basis:100%;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--rc);border-radius:999px;padding:4px 6px 4px 4px}
  .mebar .av{width:30px;height:30px;font-size:15px}
  .mebar b{flex:1;min-width:0}
  .mebar button{font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:999px;padding:2px 12px;color:var(--ink);cursor:pointer}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tab{white-space:nowrap;padding:8px 10px}
  header.top p{font-size:14px}
  .layout{margin-top:14px;gap:16px}
}
.drawbar select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.drawbar .btn{align-self:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.drawn{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.drawhead{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:start;margin-bottom:6px}
.drawhead .core{width:56px;height:56px;font-size:26px}
.sample{font-size:12.5px;background:var(--sulfur-bg);border-radius:4px;padding:2px 8px;display:inline-block;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.tile.focus{border-color:var(--rc);box-shadow:inset 0 0 0 1px var(--rc)}
.tile .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.tile .lbl{font-weight:700;font-size:14px}
.tile .val{font-size:26px;font-weight:700;line-height:1.15}
.tile .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.tile .cmp{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .rd{font-size:13.5px;margin:0}
.st{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.st i{font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;background:var(--sc)}
.st.warn i{color:#1C2420}
.yours{font-size:11px;letter-spacing:.06em;color:var(--ink);background:var(--sulfur-bg);border-radius:4px;padding:0 6px}
.spark{position:relative}
.spark svg{display:block;width:100%;height:auto;overflow:visible;touch-action:none}
.spark text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.tip{position:absolute;top:-6px;transform:translate(-50%,-100%);pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:2px 7px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tile details{font-size:12.5px;color:var(--muted)}
.tile details summary{cursor:pointer}
.tile table{border-collapse:collapse;margin-top:4px;font-variant-numeric:tabular-nums}
.tile td,.tile th{padding:1px 10px 1px 0;text-align:left;font-weight:400}
.gaplist{margin:0;padding-left:1.2em}
.gaplist li{margin-bottom:4px}
.unknown{border:1px dashed var(--muted);border-radius:8px;padding:12px 14px}
@media (prefers-reduced-motion:no-preference){.dcard{transition:box-shadow .3s,border-color .3s}}
</style>
</head>
<body>

<div class="strata" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div>
      <h1>霧谷角色數據手冊</h1>
      <p>抽到事件卡時，在這裡選同一張卡，系統會提供這張卡的現場數據，以及這些數據代表什麼，幫助你做判斷。左邊先選你的角色，系統會標出你這個身分最需要看的數據。</p>
    </div>
    <span class="case">案件：霧谷一號・探勘測試</span>
    <a class="case" href="qr.html" style="text-decoration:none">連線 QR code</a>
  </header>

  <div class="layout">
    <nav class="picker" id="picker" aria-label="選擇我的角色"><span class="lab">我的角色</span></nav>
    <main>
      <div class="tabs" role="tablist" id="tabs"></div>
      <section id="p-role" role="tabpanel"></section>
      <section id="p-draw" role="tabpanel" hidden></section>
      <section id="p-events" role="tabpanel" hidden></section>
      <section id="p-judge" role="tabpanel" hidden></section>
      <p class="note">「抽卡現場」的數值、門檻與時間軸都是為霧谷一號虛構的教學數據，不是真實監測結果。參考值僅供課堂判讀練習，實際標準以現行法規與主管機關公告為準。霧谷一號的地點、時程與工作安排都是虛構設定；事件卡取材自新聞與國外案例，詳細內容請掃描卡片上的 QR code。</p>
    </main>
  </div>
</div>

<script>
const ROLES = {
  lubi:{name:"鹿比",ch:"鹿",title:"開發商",
    identity:"「霧谷一號」測試案的提案人。你要讓測試順利進行，也要讓大家相信這個案子值得做。",
    stance:"進度和成本是你的壓力；但隱瞞資料缺口，只會讓案子之後卡得更久。",
    duty:"送件與補件，把口頭承諾寫成可以追蹤的條件。",
    goal:"爭取「附條件繼續」，並主動揭露一項不確定性。",
    secret:"保留可行時程，同時準備替代方案。",
    data:{
      temp:"決定這口井有沒有發電價值。溫度高只是第一關，還要有足夠流量。",
      flow:"流量決定能發多少電、多久能回本。流量快速下降，要先排除結垢或堵塞（事件 M）。",
      gradient:"決定要鑽多深、花多少錢。比較不同井位時要比梯度，不是只比溫度（事件 F、G）。",
      perm:"沒有讓水流動的裂隙，再熱也抽不出來。這是決定「繼續」或「換位置」的關鍵。",
      corrosion:"選錯材料，井管會提早損壞，成本和安全風險一起上升（事件 H、N）。",
      baseline:"沒有施工前資料，居民反映問題時，你無法證明「不是測試造成的」。基線也是保護你自己的證據。",
      disclosure:"每週公布摘要，對你來說是透明，對居民來說可能太慢。即時公開能換到信任。"},

    <button class="chip ${evFilter==="lead"?"on":""}" data-evf="lead">${r.name}是第一發言人</button>
  </div>
  <div class="evlist">${list.length?list.map(e=>{const s=ROLES[e.spk];const mine=e.data.filter(d=>r.data[d]);
    return `<details class="ev" id="ev-${e.id}" style="${rc(e.spk)}">
    <summary><span class="core">${e.id}</span><span class="evt">${e.title}${e.spk===role?'<span class="mine">我先發言</span>':''}<span class="src">${e.src}</span></span><span class="spk">${s.name}・${s.title}</span></summary>
    <div class="evbody">
      <p style="margin:0"><b>發生了什麼？</b>${e.what}</p>
      <details class="sixsitu"><summary><b>六個角色看到的現況</b></summary><div class="alllines" style="margin-top:8px">${ROLE_ORDER.map(id=>`<div class="ln ${id===role?"me":""}" style="${rc(id)}"><b>${ROLES[id].name}：</b>${situ(e.id,id)}</div>`).join("")}</div></details>
      <div><h3>六個角色的台詞</h3><div class="alllines">${ROLE_ORDER.map(id=>{const L=LINES[e.id][id],R=ROLES[id];return `<div class="ln ${id===role?"me":""}" style="${rc(id)}"><b>${R.name}${id===e.spk?"（第一發言人）":""}：</b>「${L[0]||e.line}」<span class="ask">${L[1]}</span></div>`}).join("")}</div></div>
      <div><h3>要看的數據</h3><div class="chips">${e.data.map(d=>`<span class="chip ${r.data[d]?"on":""}" style="cursor:default">${DATA[d].name}</span>`).join("")}</div>
        <p class="hint" style="margin-top:6px">標黃色的，是${r.name}最需要看的數據。</p></div>
      <div class="meaning"><h3>數據背後的意義</h3><p>${e.meaning}</p></div>
      <div><h3>三個選項：需要的依據與代價</h3><div class="opts">${e.opts.map((o,i)=>`<div class="opt"><h4><span class="letter">${"ABC"[i]}</span>　${o[0]}</h4><p>${o[1]}</p></div>`).join("")}</div></div>
      <div class="foryou" style="${rc(role)}"><h3>${r.name}（${r.title}）看這張卡</h3>
        ${mine.length?mine.map(d=>`<p><b>${DATA[d].name}：</b>${r.data[d]}</p>`).join(""):`<p>這張卡沒有你最常用的數據。可以從「${r.questions[0]}」開始提問，或請${s.name}說明他的依據。</p>`}</div>
    </div></details>`}).join(""):`<p class="hint">沒有符合的事件卡。</p>`}</div>`;
}

const J={ev:"B",opt:"0",basis:"溫泉水位一夕下降 9.5 公尺，而且下降的時間和測試期間重疊。",lack:"施工前的溫泉水位基線，以及同期降雨和其他抽水井的資料",who:"鹿比（開發商）委託第三方監測單位",when:"恢復測試"};
function renderJudge(){
  const r=ROLES[role];
  $("#p-judge").innerHTML=`
  <h2>判斷卡</h2>
  <p class="lede">每輪辯論前，用這個句型整理自己的想法：「我的判斷是＿＿，依據是＿＿；仍缺＿＿，應由＿＿在＿＿前處理。」下面已填入一個範例，可以直接改寫。</p>
  <div class="judge">
    <form class="jf" id="jf">
      <label for="j-ev">事件卡<select id="j-ev">${EVENTS.map(e=>`<option value="${e.id}" ${e.id===J.ev?"selected":""}>${e.id}　${e.title}</option>`).join("")}</select></label>
      <label for="j-opt">我的判斷<select id="j-opt"></select></label>
      <div><span class="hint">這張卡的數據，點一下就加入「依據」：</span><div class="chips" id="j-chips" style="margin-top:4px"></div></div>
      <label for="j-basis">依據是（引用數據）<textarea id="j-basis">${esc(J.basis)}</textarea></label>
      <label for="j-lack">仍缺（哪些資料或條件）<textarea id="j-lack">${esc(J.lack)}</textarea></label>
      <label for="j-who">應由誰處理<textarea id="j-who" style="min-height:44px">${esc(J.who)}</textarea></label>
      <label for="j-when">在什麼時間點之前<textarea id="j-when" style="min-height:44px">${esc(J.when)}</textarea></label>
    </form>
    <div class="out" style="${rc(role)}"><span class="eyebrow">${r.name}・${r.title}的判斷</span>
      <p class="sentence" id="j-out"></p>
      <button class="btn" id="j-copy" type="button">複製這段話</button>
      <p class="hint" id="j-msg" role="status"></p>
      <p class="hint">咕咕的最終判定還要再回答：哪個疑慮仍未解決？何時、用什麼標準重新檢查？</p>
    </div>
  </div>`;
  fillJudgeOpts();
}
function fillJudgeOpts(){
  const e=EVENTS.find(x=>x.id===J.ev);
  $("#j-opt").innerHTML=e.opts.map((o,i)=>`<option value="${i}" ${String(i)===J.opt?"selected":""}>${"ABC"[i]}　${o[0]}</option>`).join("")+`<option value="x" ${J.opt==="x"?"selected":""}>都不選，提出修改方案</option>`;
  $("#j-chips").innerHTML=e.data.map(d=>`<button type="button" class="chip ${ROLES[role].data[d]?"on":""}" data-add="${d}">＋ ${DATA[d].name}</button>`).join("");
  updateJudge();
}
function updateJudge(){
  const r=ROLES[role],e=EVENTS.find(x=>x.id===J.ev);
  const choice=J.opt==="x"?"提出修改方案":`${"ABC"[+J.opt]}「${e.opts[+J.opt][0]}」`;
  const f=v=>`<u>${esc(v.trim()||"＿＿")}</u>`;
  $("#j-out").innerHTML=`我是${r.name}（${r.title}）。針對事件 ${e.id}「${esc(e.title)}」，我的判斷是 ${f(choice)}，依據是 ${f(J.basis)}；仍缺 ${f(J.lack)}，應由 ${f(J.who)} 在 ${f(J.when)} 前處理。`;
}

/* ---------- 抽卡現場 ---------- */
let drawn=[];try{drawn=JSON.parse(store.get("drawn")||"[]").filter(x=>SIM[x])}catch(e){drawn=[]}
let cur=drawn.length?drawn[drawn.length-1]:"B";
const fmt=v=>(Math.round(v*100)/100).toLocaleString("zh-TW");
function spark(m,t,key){
  const W=260,H=78,pl=4,pr=50,pt=10,pb=8,n=m.s.length;
  const ref=[m.base,m.lim].filter(v=>v!=null);
  let lo=Math.min(...m.s,...ref),hi=Math.max(...m.s,...ref);const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;
  const x=i=>pl+i*(W-pl-pr)/(n-1),y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const pts=m.s.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let lab=[];
  if(m.lim!=null)lab.push({v:m.lim,txt:"門檻 "+fmt(m.lim),dash:"5 4"});
  if(m.base!=null)lab.push({v:m.base,txt:"基線 "+fmt(m.base),dash:"2 3"});
  if(lab.length===2&&Math.abs(y(lab[0].v)-y(lab[1].v))<12){const up=y(lab[0].v)<y(lab[1].v)?0:1;lab[up].dy=-5;lab[1-up].dy=7}
  const refs=lab.map(l=>`<line x1="${pl}" x2="${W-pr}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="${l.dash}"/><text x="${W-pr+5}" y="${y(l.v)+3.5+(l.dy||0)}">${l.txt}</text>`).join("");
  const last=n-1;
  const desc=`${m.label}：`+m.s.map((v,i)=>`${t[i]} ${fmt(v)}`).join("、");
  return `<div class="spark" data-key="${key}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(desc)}">
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)" stroke-width="1"/>
    ${refs}
    <polyline points="${pts}" fill="none" stroke="var(--deep)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last)}" cy="${y(m.s[last])}" r="4.5" fill="${ST[m.st][2]}" stroke="var(--surface)" stroke-width="2"/>
    <line class="hl" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <circle class="hd" r="4" fill="var(--deep)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect x="0" y="0" width="${W-pr+4}" height="${H}" fill="transparent"/>
  </svg><span class="tip" hidden></span></div>`;
}
function renderDraw(){
  const r=ROLES[role],e=EVENTS.find(x=>x.id===cur),sim=SIM[cur],s=ROLES[e.spk];
  const tiles=sim.m.map((m,i)=>{
    const st=ST[m.st],mine=!!r.data[m.d];
    const t=m.t||sim.t;
    const val=m.s?`${fmt(m.s[m.s.length-1])}<small>${esc(m.unit)}</small>`:esc(m.v);
    let cmp="";
    if(m.s){const parts=[];if(m.base!=null){const d=m.s[m.s.length-1]-m.base;parts.push(`比基線 ${d>=0?"+":"−"}${fmt(Math.abs(d))}`)}if(m.lim!=null)parts.push(`門檻 ${fmt(m.lim)}`);parts.push(`最新：${t[t.length-1]}`);cmp=parts.join("｜")}
    return `<article class="tile ${mine?"focus":""}" style="${rc(role)}">
      <div class="hd"><span class="lbl">${esc(m.label)}</span><span class="st ${m.st}" style="--sc:${st[2]}"><i aria-hidden="true">${st[1]}</i>${st[0]}</span></div>
      <div class="val">${val}</div>
      ${cmp?`<div class="cmp">${cmp}</div>`:""}
      ${m.s?spark(m,t,cur+i):""}
      <p class="rd">${m.rd}</p>
      ${mine?`<div class="mini"><span class="yours">${r.name}的重點</span></div>`:""}
      ${m.d?`<details><summary>這個數據怎麼讀</summary><p style="margin:4px 0">${DATA[m.d].read}</p><p style="margin:0"><b>參考：</b>${DATA[m.d].ref}</p></details>`:""}
      ${m.s?`<details><summary>看數據表</summary><table><tbody>${m.s.map((v,j)=>`<tr><th scope="row">${t[j]}</th><td>${fmt(v)} ${esc(m.unit)}</td></tr>`).join("")}</tbody></table></details>`:""}
    </article>`}).join("");
  const mineM=sim.m.filter(m=>r.data[m.d]);
  $("#p-draw").innerHTML=`
  <h2>抽卡現場</h2>
  <p class="lede">咕咕抽出事件卡、唸完卡片後，每個人在自己的手機上按同一張卡的字母。畫面會顯示霧谷一號此刻的現場數據，幫你在三個選項之間做判斷。</p>
  <div class="drawbar">
    <span class="hint" style="flex-basis:100%">桌上抽到哪張事件卡，就按卡片右下角的字母：</span>
    <div class="letters" role="group" aria-label="選擇事件卡">${EVENTS.map(x=>`<button class="lt ${x.id===cur?"on":""} ${drawn.includes(x.id)?"done":""}" type="button" data-lt="${x.id}" aria-pressed="${x.id===cur}" aria-label="事件卡 ${x.id}：${x.title}">${x.id}</button>`).join("")}</div>
    <div class="drawn">本局已抽（${drawn.length}／4）：${drawn.length?drawn.map((x,i)=>`<button class="chip ${x===cur?"on":""}" data-cur="${x}" style="padding:0 8px">事件${"一二三四"[i]||i+1}・${x}</button>`).join(""):"還沒抽"}</div>
    <button class="btn ghost" id="dr-reset" type="button" ${drawn.length?"":"disabled"}>重新開一局</button>
  </div>
  ${drawn.length?"":`<span class="sample">目前顯示範例：事件 B。按下你們抽到的字母後，會換成這一輪的事件。</span>`}
  <div class="drawhead" style="${rc(e.spk)}"><span class="core">${e.id}</span>
    <div><h2 style="margin:0">${e.title}</h2><p class="hint" style="margin:2px 0 0">${sim.scene}　第一發言人：<b style="color:var(--rc)">${s.name}（${s.title}）</b></p></div></div>
  ${myLineBox(e)}

  ${mineM.length?`<div class="foryou" style="${rc(role)};margin-bottom:20px"><h3>${r.name}（${r.title}）：先看這幾項</h3>${[...new Set(mineM.map(m=>m.d))].map(d=>`<p>${mineM.filter(m=>m.d===d).map(m=>`<span class="st ${m.st}" style="--sc:${ST[m.st][2]}"><i aria-hidden="true">${ST[m.st][1]}</i>${ST[m.st][0]}</span>　<b>${esc(m.label)}：</b>${m.s?fmt(m.s[m.s.length-1])+" "+esc(m.unit):esc(m.v)}`).join("<br>")}<br><span class="hint">${r.data[d]}</span></p>`).join("")}<p class="hint">做判斷時，先問自己：${r.questions[0]}</p></div>`:""}
  <div class="section"><h3>現場數據</h3>
    ${mineM.length?`<p class="hint" style="margin-bottom:10px">加框的是${r.name}最需要看的數據。</p>`:`<p class="hint" style="margin-bottom:10px">這張卡沒有${r.name}最常用的數據，可以先追問其他角色的依據。</p>`}
    <div class="tiles">${tiles}</div></div>

  <div class="section unknown"><h3>目前還不知道的事</h3><ul class="gaplist">${sim.gaps.map(g=>`<li>${g}</li>`).join("")}</ul>
    <p class="hint" style="margin-top:6px">缺資料不等於沒風險。決定時要說清楚：這些缺口由誰、在什麼時候補上。</p></div>

  <div class="section situ" style="${rc(role)}"><span class="eyebrow">依目前的數據</span><h3>${r.name}（${r.title}）看到的現況</h3><p>${situ(e.id,role)}</p></div>

  <div class="section"><h3>三個選項</h3>
    <div class="opts">${e.opts.map((o,i)=>`<div class="opt"><h4><span class="letter">${"ABC"[i]}</span>　${o[0]}</h4><p class="hint">代價與前提：${o[1]}</p></div>`).join("")}</div>
    <p class="hint" style="margin-top:8px">沒有標準答案。全組達成共識後，用迴紋針夾住選項；也可以提出修改後的選項。</p></div>

  <button class="btn" type="button" data-judge="${e.id}">用這些數據寫判斷卡</button>`;
}
function myLineBox(e){
  const r=ROLES[role],L=LINES[e.id][role],s=ROLES[e.spk],lead=role===e.spk;
  return `<div class="myline" style="${rc(role)}">
    <span class="eyebrow">${lead?"你是第一發言人：請先唸這段台詞":`${r.name}（${r.title}）的台詞`}</span>
    <p class="say">「${lead?e.line:L[0]}」</p>
    <p class="ask"><b>接著追問</b>　${L[1]}</p>
    ${lead?"":`<p class="hint" style="margin:0">第一發言人是${s.name}，請等${s.name}唸完卡片上的台詞後再發言。</p>`}
  </div>`;
}
function hoverSpark(ev){
  const box=ev.target.closest(".spark");if(!box)return;
  const [eid,idx]=[box.dataset.key[0],+box.dataset.key.slice(1)];
  const m=SIM[eid].m[idx],t=m.t||SIM[eid].t,svg=box.querySelector("svg");
  const W=260,H=78,pl=4,pr=50,pt=10,pb=8,n=m.s.length;
  const rect=svg.getBoundingClientRect(),sx=(ev.clientX-rect.left)*W/rect.width;
  const i=Math.max(0,Math.min(n-1,Math.round((sx-pl)/((W-pl-pr)/(n-1)))));
  const ref=[m.base,m.lim].filter(v=>v!=null);
  let lo=Math.min(...m.s,...ref),hi=Math.max(...m.s,...ref);const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;
  const x=pl+i*(W-pl-pr)/(n-1),y=pt+(hi-m.s[i])*(H-pt-pb)/(hi-lo);
  const hl=svg.querySelector(".hl"),hd=svg.querySelector(".hd"),tip=box.querySelector(".tip");
  hl.setAttribute("x1",x);hl.setAttribute("x2",x);hl.setAttribute("visibility","visible");
  hd.setAttribute("cx",x);hd.setAttribute("cy",y);hd.setAttribute("visibility","visible");
  tip.textContent=`${t[i]}：${fmt(m.s[i])} ${m.unit}`;tip.style.left=(x*rect.width/W)+"px";tip.style.top=(y*rect.height/H-6)+"px";tip.hidden=false;
}
function leaveSpark(ev){
  const box=ev.target.closest&&ev.target.closest(".spark");if(!box)return;
  box.querySelector(".hl").setAttribute("visibility","hidden");box.querySelector(".hd").setAttribute("visibility","hidden");box.querySelector(".tip").hidden=true;
}
function saveDrawn(){store.set("drawn",JSON.stringify(drawn))}

function render(){renderPicker();renderTabs();renderRole();renderDraw();renderEvents();renderJudge()}

function gotoEvent(id){
  tab="events";
  if(evFilter!=="all"&&!document.getElementById("ev-"+id)){evFilter="all"}
  renderTabs();renderEvents();
  const el=document.getElementById("ev-"+id);
  if(el){el.open=true;el.scrollIntoView({block:"start"})}
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("button");if(!t)return;
  if(t.dataset.role){role=t.dataset.role;store.set("myRole",role);pickerCollapsed=true;render();return}
  if(t.id==="me-change"){pickerCollapsed=false;renderPicker();return}
  if(t.dataset.lt){cur=t.dataset.lt;if(!drawn.includes(cur)&&drawn.length<4){drawn.push(cur);saveDrawn()}renderDraw();try{history.replaceState(null,"","#"+cur)}catch(e){}return}
  if(t.dataset.tab){tab=t.dataset.tab;renderTabs();try{history.replaceState(null,"","#"+tab)}catch(e){}return}
  if(t.dataset.ev){gotoEvent(t.dataset.ev);return}
  if(t.dataset.evf){evFilter=t.dataset.evf;renderEvents();return}
  if(t.id==="dr-reset"){drawn=[];cur="B";saveDrawn();renderDraw();return}
  if(t.dataset.cur){cur=t.dataset.cur;renderDraw();return}
  if(t.dataset.judge){J.ev=t.dataset.judge;J.opt="0";J.basis="";J.lack=SIM[J.ev].gaps[0].replace(/[？。]$/,"");tab="judge";renderTabs();renderJudge();window.scrollTo(0,0);return}
  if(t.dataset.add){const n=DATA[t.dataset.add].name;J.basis=(J.basis.trim()?J.basis.trim()+"；":"")+n+"：";$("#j-basis").value=J.basis;$("#j-basis").focus();updateJudge();return}
  if(t.id==="j-copy"){const txt=$("#j-out").textContent,msg=$("#j-msg");
    const ok=()=>{msg.textContent="已複製。"};
    const fallback=()=>{const s=getSelection(),rg=document.createRange();rg.selectNodeContents($("#j-out"));s.removeAllRanges();s.addRange(rg);msg.textContent="無法自動複製，已選取文字，請按 Ctrl+C。"};
    try{navigator.clipboard.writeText(txt).then(ok,fallback)}catch(e){fallback()}}
});
document.addEventListener("input",ev=>{
  const id=ev.target.id;
  const map={"j-basis":"basis","j-lack":"lack","j-who":"who","j-when":"when"};
  if(map[id]){J[map[id]]=ev.target.value;updateJudge()}
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="j-ev"){J.ev=ev.target.value;J.opt="0";fillJudgeOpts()}
  if(ev.target.id==="j-opt"){J.opt=ev.target.value;updateJudge()}
});
let sparkBox=null;
document.addEventListener("pointerdown",ev=>{const box=ev.target.closest&&ev.target.closest(".spark");if(box){if(sparkBox&&sparkBox!==box)leaveSpark({target:sparkBox});sparkBox=box;hoverSpark(ev)}});
document.addEventListener("pointermove",ev=>{if(ev.pointerType==="touch")return;
  const box=ev.target.closest&&ev.target.closest(".spark");
  if(sparkBox&&sparkBox!==box){leaveSpark({target:sparkBox});sparkBox=null}
  if(box){sparkBox=box;hoverSpark(ev)}
});
const h=(location.hash||"").slice(1);
if(TABS.some(([k])=>k===h))tab=h;
if(SIM[h]){tab="draw";cur=h;if(!drawn.includes(h)&&drawn.length<4){drawn.push(h);saveDrawn()}}
render();
</script>
